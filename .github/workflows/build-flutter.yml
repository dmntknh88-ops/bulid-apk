name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID'
        required: true
        type: string
      userId:
        description: 'User ID'
        required: true
        type: string
      payload:
        description: 'JSON payload'
        required: true
        type: string

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.24.5'
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse payload
        id: meta
        run: |
          set -e
          echo '${{ inputs.payload }}' > /tmp/payload.json
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          p = json.load(open('/tmp/payload.json'))
          def g(*ks):
            for k in ks:
              v = p.get(k)
              if v: return str(v)
            return ''
          print('zip_url=' + g('zipAssetUrl', 'zip_url', 'assetUrl'))
          print('app_name=' + (g('appName', 'app_name') or 'MyApp'))
          PY
          echo "job_id=${{ inputs.jobId }}" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Android SDK manual — lebih stabil daripada setup-android action yang sering gagal
      - name: Install Android SDK
        run: |
          set -euo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
          # struktur yang diharapkan sdkmanager: cmdline-tools/latest
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"

          export ANDROID_HOME="$ANDROID_ROOT"
          export PATH="$ANDROID_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"
          sdkmanager --list_installed | head -30

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: |
          flutter config --no-analytics
          flutter doctor -v || true

      - name: Download project ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_URL: ${{ steps.meta.outputs.zip_url }}
        run: |
          set -euo pipefail
          mkdir -p project_src
          if [ -z "${ZIP_URL}" ]; then
            echo "zipAssetUrl kosong"
            cat /tmp/payload.json || true
            exit 1
          fi
          echo "Download ZIP: $ZIP_URL"
          HTTP=$(curl -sS -L -o project.zip -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "${ZIP_URL}")
          SIZE=$(stat -c%s project.zip)
          echo "HTTP=$HTTP size=$SIZE"
          if [ "$SIZE" -lt 1000 ]; then
            head -c 400 project.zip || true
            exit 1
          fi
          unzip -q project.zip -d project_src
          if [ "$(find project_src -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && \
             [ "$(find project_src -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
            ROOT=$(find project_src -mindepth 1 -maxdepth 1 -type d | head -1)
            mv "$ROOT"/* project_src/ 2>/dev/null || true
            mv "$ROOT"/.[!.]* project_src/ 2>/dev/null || true
            rmdir "$ROOT" 2>/dev/null || true
          fi
          find project_src -maxdepth 3 -type f | head -40

      - name: Locate Flutter project
        id: proj
        run: |
          set -e
          if [ -f project_src/pubspec.yaml ]; then
            echo "dir=project_src" >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find project_src -name pubspec.yaml -type f | head -1)
            if [ -z "$FOUND" ]; then
              echo "pubspec.yaml tidak ada"
              find project_src -maxdepth 4 -type f | head -60
              exit 1
            fi
            echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
          fi

      - name: Pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get

      - name: Build APK release
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          flutter build apk --release
          APK=$(find build/app/outputs/flutter-apk -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find build -name '*.apk' -type f | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            find build -type f | head -40
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: app-release.apk
          if-no-files-found: error
          retention-days: 3
