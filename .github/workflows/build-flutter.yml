name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: true
        type: string
      assetId:
        required: false
        type: string
        default: ''
      releaseTag:
        required: false
        type: string
        default: ''
      downloadToken:
        required: false
        type: string
        default: ''

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.24.5'
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve download params
        id: meta
        env:
          PAYLOAD_JSON: ${{ inputs.payload }}
        run: |
          set -e
          printf '%s' "$PAYLOAD_JSON" > /tmp/payload.json
          python3 << 'PY'
          import json, os
          try:
            p = json.load(open('/tmp/payload.json'))
          except Exception:
            p = {}
          def g(*ks):
            for k in ks:
              v = p.get(k)
              if v is not None and str(v).strip():
                return str(v).strip()
            return ''
          asset = g('assetId', 'asset_id') or os.environ.get('INPUT_ASSETID', '') or '${{ inputs.assetId }}'
          tag = g('zipReleaseTag', 'release_tag', 'releaseTag') or os.environ.get('INPUT_RELEASETAG', '') or '${{ inputs.releaseTag }}'
          repo = g('repo') or os.environ.get('GITHUB_REPOSITORY', '')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'asset_id={asset}\n')
            f.write(f'release_tag={tag}\n')
            f.write(f'repo={repo}\n')
            f.write(f'app_name={g("appName", "app_name") or "MyApp"}\n')
          print('asset_id=', asset)
          print('release_tag=', tag)
          print('repo=', repo)
          PY

      # UNDUH ZIP DULU (sebelum SDK) biar gagal cepat + jelas
      - name: Download project ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ inputs.downloadToken }}
          ASSET_ID: ${{ steps.meta.outputs.asset_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          REPO_NAME: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          mkdir -p project_src
          REPO="${REPO_NAME:-$GITHUB_REPOSITORY}"
          TAG="${RELEASE_TAG:-}"
          AID="${ASSET_ID:-}"
          # Token: PAT worker (yang upload) prioritas, fallback GITHUB_TOKEN
          TOKEN="${PAT_TOKEN:-$GH_TOKEN}"
          if [ -z "$TOKEN" ]; then TOKEN="$GH_TOKEN"; fi

          echo "REPO=$REPO TAG=$TAG ASSET_ID=$AID token_len=${#TOKEN}"

          download_asset() {
            local id="$1"
            local out="$2"
            echo "GET releases/assets/$id"
            HTTP=$(curl -sS -L --retry 3 --retry-delay 2 \
              -o "$out" -w "%{http_code}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/releases/assets/${id}" || echo "000")
            SZ=$(stat -c%s "$out" 2>/dev/null || echo 0)
            echo "HTTP=$HTTP size=$SZ"
            # deteksi HTML error
            if head -c 20 "$out" 2>/dev/null | grep -qi '<!doctype\|<html\|{"message"'; then
              echo "Response looks like error page/json"
              head -c 300 "$out" || true
              return 1
            fi
            [ "$SZ" -gt 10000 ]
          }

          OK=0

          # 1) by asset id
          if [ -n "$AID" ] && [ "$AID" != "" ]; then
            if download_asset "$AID" project.zip; then OK=1; fi
          fi

          # 2) resolve id from tag
          if [ "$OK" -eq 0 ] && [ -n "$TAG" ]; then
            echo "Resolve asset from tag $TAG"
            REL=$(curl -sS -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" || true)
            echo "$REL" | head -c 400
            AID2=$(python3 -c "import json,sys
try:
 d=json.load(sys.stdin)
 print(next((str(a['id']) for a in d.get('assets',[]) if a.get('name')=='project.zip'),''))
except Exception:
 print('')
" <<<"$REL")
            echo "AID2=$AID2"
            if [ -n "$AID2" ]; then
              if download_asset "$AID2" project.zip; then OK=1; fi
            fi
          fi

          # 3) gh release download
          if [ "$OK" -eq 0 ] && [ -n "$TAG" ]; then
            echo "Try gh release download"
            GH_TOKEN="$TOKEN" gh release download "$TAG" -R "$REPO" -p "project.zip" -D . && OK=1 || true
            if [ -f project.zip ]; then
              SZ=$(stat -c%s project.zip)
              if [ "$SZ" -gt 10000 ]; then OK=1; else rm -f project.zip; OK=0; fi
            fi
          fi

          if [ "$OK" -eq 0 ]; then
            echo "FATAL download failed" | tee /tmp/download_error.txt
            echo "REPO=$REPO TAG=$TAG AID=$AID" >> /tmp/download_error.txt
            curl -sS -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases?per_page=3" | head -c 1500 | tee -a /tmp/download_error.txt || true
            exit 1
          fi

          SZ=$(stat -c%s project.zip)
          echo "ZIP OK size=$SZ"
          unzip -q project.zip -d project_src
          if [ "$(find project_src -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && \
             [ "$(find project_src -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
            ROOT=$(find project_src -mindepth 1 -maxdepth 1 -type d | head -1)
            mv "$ROOT"/* project_src/ 2>/dev/null || true
            mv "$ROOT"/.[!.]* project_src/ 2>/dev/null || true
            rmdir "$ROOT" 2>/dev/null || true
          fi
          find project_src -maxdepth 3 -type f | head -40

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK
        run: |
          set -euo pipefail
          ANDROID_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_HOME="$ANDROID_ROOT"
          export PATH="$ANDROID_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Locate Flutter project
        id: proj
        run: |
          set -e
          if [ -f project_src/pubspec.yaml ]; then
            echo "dir=project_src" >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find project_src -name pubspec.yaml -type f | head -1)
            if [ -z "$FOUND" ]; then
              echo "pubspec.yaml tidak ada"
              find project_src -maxdepth 4 -type f | head -60
              exit 1
            fi
            echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
          fi

      - name: Pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get

      - name: Build APK release
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          flutter build apk --release
          APK=$(find build/app/outputs/flutter-apk -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find build -name '*.apk' -type f | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            find build -type f | head -40
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: app-release.apk
          if-no-files-found: error
          retention-days: 3
