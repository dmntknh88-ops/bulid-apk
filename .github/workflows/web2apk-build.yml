name: Web2APK Auto Build Worker

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: true
        type: string
      assetId:
        required: false
        type: string
        default: ''
      releaseTag:
        required: false
        type: string
        default: ''

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.24.5'
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Parse payload
        id: meta
        run: |
          set -e
          echo '${{ inputs.payload }}' > /tmp/payload.json
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json, os
          p = json.load(open('/tmp/payload.json'))
          def g(*ks):
            for k in ks:
              v = p.get(k)
              if v: return str(v)
            return ''
          print('zip_url=' + g('zipAssetUrl', 'zip_url', 'zipBrowserUrl', 'zipAssetApiUrl'))
          print('api_url=' + g('zipAssetApiUrl', 'assetApiUrl'))
          print('browser_url=' + g('zipBrowserUrl', 'browser_download_url'))
          print('asset_id=' + g('assetId', 'asset_id') or os.environ.get('INPUT_ASSETID',''))
          print('release_tag=' + g('zipReleaseTag', 'release_tag') or os.environ.get('INPUT_RELEASETAG',''))
          print('repo=' + g('repo'))
          print('app_name=' + (g('appName', 'app_name') or 'MyApp'))
          PY
          echo "job_id=${{ inputs.jobId }}" >> $GITHUB_OUTPUT
          if [ -n "${{ inputs.assetId }}" ]; then
            echo "asset_id=${{ inputs.assetId }}" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ inputs.releaseTag }}" ]; then
            echo "release_tag=${{ inputs.releaseTag }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK
        run: |
          set -euo pipefail
          ANDROID_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_HOME="$ANDROID_ROOT"
          export PATH="$ANDROID_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Download project ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_URL: ${{ steps.meta.outputs.zip_url }}
          API_URL: ${{ steps.meta.outputs.api_url }}
          BROWSER_URL: ${{ steps.meta.outputs.browser_url }}
          ASSET_ID: ${{ steps.meta.outputs.asset_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          mkdir -p project_src
          REPO_NAME="${REPO:-${{ github.repository }}}"

          download_ok=0
          try_download() {
            local url="$1"
            local label="$2"
            if [ -z "$url" ] || [ "$url" = "" ]; then
              return 1
            fi
            echo "Try ($label): $url"
            HTTP=$(curl -sS -L -o project.zip -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              "$url" || echo "000")
            SIZE=$(stat -c%s project.zip 2>/dev/null || echo 0)
            echo "  HTTP=$HTTP size=$SIZE"
            if [ "$SIZE" -gt 1000 ]; then
              download_ok=1
              return 0
            fi
            return 1
          }

          # 1) release download by tag
          if [ -n "${RELEASE_TAG}" ]; then
            try_download "https://github.com/${REPO_NAME}/releases/download/${RELEASE_TAG}/project.zip" "tag-download" || true
          fi
          # 2) payload zip_url
          if [ "$download_ok" -eq 0 ]; then
            try_download "$ZIP_URL" "zip_url" || true
          fi
          # 3) browser url
          if [ "$download_ok" -eq 0 ]; then
            try_download "$BROWSER_URL" "browser" || true
          fi
          # 4) API asset by id
          if [ "$download_ok" -eq 0 ] && [ -n "$ASSET_ID" ]; then
            try_download "https://api.github.com/repos/${REPO_NAME}/releases/assets/${ASSET_ID}" "asset-id" || true
          fi
          # 5) api url
          if [ "$download_ok" -eq 0 ]; then
            try_download "$API_URL" "api_url" || true
          fi

          if [ "$download_ok" -eq 0 ]; then
            echo "Semua sumber unduh ZIP gagal"
            echo "ZIP_URL=$ZIP_URL"
            echo "ASSET_ID=$ASSET_ID TAG=$RELEASE_TAG REPO=$REPO_NAME"
            ls -la project.zip 2>/dev/null || true
            head -c 300 project.zip 2>/dev/null || true
            exit 1
          fi

          unzip -q project.zip -d project_src
          if [ "$(find project_src -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && \
             [ "$(find project_src -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
            ROOT=$(find project_src -mindepth 1 -maxdepth 1 -type d | head -1)
            mv "$ROOT"/* project_src/ 2>/dev/null || true
            mv "$ROOT"/.[!.]* project_src/ 2>/dev/null || true
            rmdir "$ROOT" 2>/dev/null || true
          fi
          find project_src -maxdepth 3 -type f | head -40

      - name: Locate Flutter project
        id: proj
        run: |
          set -e
          if [ -f project_src/pubspec.yaml ]; then
            echo "dir=project_src" >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find project_src -name pubspec.yaml -type f | head -1)
            if [ -z "$FOUND" ]; then
              echo "pubspec.yaml tidak ada"
              find project_src -maxdepth 4 -type f | head -60
              exit 1
            fi
            echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
          fi

      - name: Pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get

      - name: Build APK release
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          flutter build apk --release
          APK=$(find build/app/outputs/flutter-apk -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find build -name '*.apk' -type f | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            find build -type f | head -40
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: app-release.apk
          if-no-files-found: error
          retention-days: 3
